<meta charset="UTF-8" />
<title>登入 — 國際貨運報價作業台</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="stylesheet" href="css/style.css" />

<div class="auth-page">
  <div class="auth-card">
    <h1 id="form-title">登入</h1>
    <p class="subtitle">國際貨運報價作業台</p>

    <div id="message" class="message"></div>

    <form id="auth-form">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" autocomplete="email" required />
      </div>
      <div class="field">
        <label for="password">密碼</label>
        <input type="password" id="password" autocomplete="current-password" required minlength="6" />
      </div>
      <button type="submit" class="btn-primary" id="submit-btn">登入</button>
    </form>

    <p class="auth-switch">
      <span id="switch-text">還沒有帳號?</span>
      <a id="switch-link">註冊新帳號</a>
    </p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/auth.js"></script>
